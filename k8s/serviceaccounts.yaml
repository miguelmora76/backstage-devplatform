# One service account per workload, with no role binding anywhere and no
# token mounted into the pods: the sample never talks to the Kubernetes API
# (NFR5.15, NFR5.16). A unit test asserts each workload uses its own account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: guardrails-server
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
automountServiceAccountToken: false
