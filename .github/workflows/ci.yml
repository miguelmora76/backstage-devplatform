name: CI

# Shared workflow. u1-data-and-server adds the eight stages below for the
# guardrails server; u2-plugin-backend adds its own stages 4 to 8 (the jobs
# named plugin-*) and its lint and type check steps; u5-compose-and-ci extends
# it with the compose run. Nothing is deployed or pushed from here, and no
# secret is used: the default token only reads the code. The PostgreSQL
# password below is a throw-away value valid only inside the job.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PACKAGE: packages/guardrails-server
  PLUGIN: packages/plugin-guardrails-backend
  PLUGIN_NAME: plugin-guardrails-backend
  UI: packages/plugin-guardrails
  UI_NAME: plugin-guardrails
  APP: packages/app
  APP_NAME: app
  BACKEND: packages/backend
  BACKEND_NAME: backend
  E2E: packages/e2e
  E2E_NAME: e2e

jobs:
  # Stage 1: Prettier check over all code (NFR6.1). Any difference fails.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn prettier:check

  # Stage 2: ESLint with Backstage's usual settings. Any error fails.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn --cwd ${{ env.PACKAGE }} backstage-cli package lint
      - run: yarn --cwd ${{ env.PLUGIN }} backstage-cli package lint
      # u3-plugin-ui: the same lint, plus its rules that forbid raw-HTML
      # insertion, fetch and storage outside the API and session, and ports.
      - run: yarn --cwd ${{ env.UI }} backstage-cli package lint
      # u4-backstage-app: the same lint, plus its rules that forbid raw-HTML
      # insertion, console output, storage, module-level state, and addresses
      # or ports written in source.
      - run: yarn --cwd ${{ env.APP }} backstage-cli package lint
      - run: yarn --cwd ${{ env.BACKEND }} backstage-cli package lint
      # u5-compose-and-ci: the start script logic and the end-to-end checks.
      - run: yarn --cwd ${{ env.E2E }} backstage-cli package lint

  # Stage 3: TypeScript compile without output. Any error fails.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn tsc -p ${{ env.PACKAGE }}
      - run: yarn tsc -p ${{ env.PLUGIN }}
      - run: yarn tsc -p ${{ env.UI }}
      - run: yarn tsc -p ${{ env.BACKEND }}
      - run: yarn tsc -p ${{ env.APP }}
      - run: yarn tsc -p ${{ env.E2E }}

  # Stage 4: all unit tests (including the 200-call benchmark, the 10-call
  # concurrency test, the log-line test and the settings tests) with the
  # coverage report. A failing test, or line coverage below 85%, fails.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn --cwd ${{ env.PACKAGE }} backstage-cli package test --watchAll=false --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: ${{ env.PACKAGE }}/coverage
          if-no-files-found: ignore

  # Stage 5: builds the default data set twice and compares byte for byte,
  # then compares with the stored copy kept with the tests (NFR7.1).
  repeatability:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn --cwd ${{ env.PACKAGE }} build
      - name: Generate the default data set twice and compare
        run: |
          node ${{ env.PACKAGE }}/dist/generator/cli.js > first.json
          node ${{ env.PACKAGE }}/dist/generator/cli.js > second.json
          cmp first.json second.json
          cmp first.json ${{ env.PACKAGE }}/test-data/default-data-set.json

  # Stage 6: contract tests check the four tools against the C2 spec file.
  # u2-plugin-backend runs the same spec check on its stand-in.
  contract:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn --cwd ${{ env.PACKAGE }} backstage-cli package test --watchAll=false src/contract.test.ts

  # Stages 7 and 8: build the image without pushing it, check it runs as a
  # non-root user and exposes one port, then start it (read-only root file
  # system, no published port), wait for the health route, call one tool and
  # stop it. Not ready within 10 seconds, or a failed call, fails.
  image:
    needs: [repeatability, contract]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Stage 7 - build the image (not pushed)
        run: docker build -f ${{ env.PACKAGE }}/Dockerfile -t guardrails-server:ci .
      - name: Stage 7 - check non-root user and one exposed port
        run: |
          user=$(docker image inspect guardrails-server:ci --format '{{.Config.User}}')
          echo "image user: ${user}"
          test -n "${user}" && test "${user}" != "root" && test "${user}" != "0"
          ports=$(docker image inspect guardrails-server:ci --format '{{len .Config.ExposedPorts}}')
          echo "exposed ports: ${ports}"
          test "${ports}" = "1"
      - name: Stage 8 - container smoke test
        run: |
          docker run -d --name guardrails-smoke --read-only guardrails-server:ci
          ready=0
          for i in $(seq 1 10); do
            if docker exec guardrails-smoke node packages/guardrails-server/dist/probe/healthcheck.js; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "${ready}" != "1" ]; then
            docker logs guardrails-smoke
            exit 1
          fi
          docker exec guardrails-smoke node packages/guardrails-server/dist/probe/smoke.js
          docker logs guardrails-smoke
          docker stop guardrails-smoke
      - name: Stage 8 - container with the failure setting on fails the call
        run: |
          docker run -d --name guardrails-forced --read-only -e GUARDRAILS_FAILURE_MODE=on guardrails-server:ci
          for i in $(seq 1 10); do
            if docker exec guardrails-forced node packages/guardrails-server/dist/probe/healthcheck.js; then
              break
            fi
            sleep 1
          done
          if docker exec guardrails-forced node packages/guardrails-server/dist/probe/smoke.js; then
            echo "expected the call to fail with the failure setting on"
            exit 1
          fi
          docker stop guardrails-forced

  # ---- u2-plugin-backend: stages 4 to 8 for plugin-guardrails-backend ----

  # Stage 4 (plugin): unit tests that use the in-memory SQLite store. The
  # PostgreSQL cases skip because no connection string is set. Any failing test
  # fails.
  plugin-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace ${{ env.PLUGIN_NAME }} test --watchAll=false

  # Stage 5 (plugin): the rule tests (claim, release, repair, append-only
  # trigger, restart, concurrency) against the PostgreSQL service container.
  # No Docker-in-Docker is needed. Any failing test fails.
  plugin-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_USER: postgres
          # Named exemption of the secret test (packages/e2e, NFR5.2): this
          # throw-away login is valid only inside this job.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BACKSTAGE_TEST_DATABASE_POSTGRES16_CONNECTION_STRING: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace ${{ env.PLUGIN_NAME }} test --watchAll=false src/integration src/store src/database src/workflow

  # Stage 6 (plugin): line coverage over the plugin code from the fast tests and
  # the PostgreSQL rule tests together. Below 85% fails (the threshold is in the
  # package settings and is never lowered).
  plugin-coverage:
    needs: [plugin-unit, plugin-rules]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_USER: postgres
          # Named exemption of the secret test (packages/e2e, NFR5.2): this
          # throw-away login is valid only inside this job.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BACKSTAGE_TEST_DATABASE_POSTGRES16_CONNECTION_STRING: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace ${{ env.PLUGIN_NAME }} test --watchAll=false --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-coverage
          path: ${{ env.PLUGIN }}/coverage
          if-no-files-found: ignore

  # Stage 7 (plugin): contract check. The stand-in server and the client are
  # compared with the C2 spec kept by u1; the route list and the code lists are
  # compared with the C1 file. Any mismatch fails.
  plugin-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace ${{ env.PLUGIN_NAME }} contract:check

  # Stage 8 (plugin): builds the plugin. The backend package that includes it
  # belongs to u4-backstage-app; its build is added to this job when it exists.
  plugin-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace ${{ env.PLUGIN_NAME }} build

  # ---- u3-plugin-ui: jobs for plugin-guardrails (the browser plugin) ----

  # All plugin tests in a simulated browser with the time zone and clock
  # pinned (NFR7.1), run once with the coverage report. The 85% line threshold
  # is in the package settings and is never lowered. Any failing test fails.
  ui-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace ${{ env.UI_NAME }} test --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-coverage
          path: ${{ env.UI }}/coverage
          if-no-files-found: ignore

  # Reads the coverage report that ui-unit produced (it does not run the tests
  # again) and fails below 85% line coverage.
  ui-coverage:
    needs: ui-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-coverage
          path: ui-coverage
      - name: Check line coverage is at least 85%
        run: |
          node -e "
            const s = require('./ui-coverage/coverage-summary.json');
            const pct = s.total.lines.pct;
            console.log('line coverage: ' + pct + '%');
            if (pct < 85) { console.error('below 85%'); process.exit(1); }
          "

  # Contract check: the stand-in backend is compared with c1-openapi.yaml of
  # u2, and the sign-in start answer is checked against u2's own module.
  ui-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace ${{ env.UI_NAME }} contract:check

  # Builds the plugin and keeps its output for ui-checks. The app package that
  # includes the plugin belongs to u4-backstage-app; its build is added to this
  # job when it exists.
  ui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace ${{ env.UI_NAME }} build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ${{ env.UI }}/dist

  # On the built plugin: no host name or address in the code, at most 300 KB
  # compressed (NFR1.7, NFR5.11), and only allowed packages in the manifest
  # (NFR5.12).
  ui-checks:
    needs: ui-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ${{ env.UI }}/dist
      - run: node ${{ env.UI }}/scripts/check-packages.mjs
      - run: node ${{ env.UI }}/scripts/check-built.mjs

  # ---- u4-backstage-app: jobs for the app (packages/app, packages/backend) ----

  # One run of every unit test of both packages except the start-up test, with
  # coverage (sign-in page, identity handling, catalog logic, settings check,
  # lint-rule fixtures). The 85% line threshold is in each package's settings
  # and is never lowered. Any failing test fails.
  app-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      # The catalog tests use the generator (a development dependency, D10).
      - run: yarn workspace guardrails-server build
      - run: yarn workspace ${{ env.APP_NAME }} test --coverage
      - run: yarn workspace ${{ env.BACKEND_NAME }} test --coverage --testPathIgnorePatterns startup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-coverage
          path: |
            ${{ env.APP }}/coverage/coverage-summary.json
            ${{ env.BACKEND }}/coverage/coverage-summary.json
          if-no-files-found: ignore

  # Reads the coverage reports that app-unit produced (it does not run the
  # tests again) and fails below 85% line coverage in either package.
  app-coverage:
    needs: app-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-coverage
          path: app-coverage
      - name: Check line coverage is at least 85%
        run: |
          for f in $(find app-coverage -name coverage-summary.json); do
            node -e "
              const s = require('./$f');
              const pct = s.total.lines.pct;
              console.log('$f line coverage: ' + pct + '%');
              if (pct < 85) { console.error('below 85%'); process.exit(1); }
            "
          done

  # The start-up test: the real feature list in Backstage's test backend with
  # a stand-in guardrails server and a recording logger. No Docker. Any
  # failing check fails.
  app-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace ${{ env.BACKEND_NAME }} test startup

  # The committed catalog equals the script output for the default seed, and
  # the script gives the same bytes on two runs (NFR7.1, NFR2.4).
  app-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace guardrails-server build
      - run: yarn workspace ${{ env.BACKEND_NAME }} catalog:check
      - name: Write the catalog twice and compare byte for byte
        run: |
          yarn workspace ${{ env.BACKEND_NAME }} catalog:write --out catalog/first.yaml
          yarn workspace ${{ env.BACKEND_NAME }} catalog:write --out catalog/second.yaml
          cmp ${{ env.BACKEND }}/catalog/first.yaml ${{ env.BACKEND }}/catalog/second.yaml
          cmp ${{ env.BACKEND }}/catalog/first.yaml ${{ env.BACKEND }}/catalog/guardrails-catalog.yaml

  # The committed settings, the package allow-lists and the lint bans
  # (NFR2.5, NFR5.4 to NFR5.6, NFR5.8). Any hit fails.
  app-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace ${{ env.BACKEND_NAME }} check:settings
      - run: yarn workspace ${{ env.BACKEND_NAME }} check:packages
      - run: yarn workspace ${{ env.APP_NAME }} check:packages

  # Builds both packages and keeps the output for u5's image build. A last
  # step starts the real backend entry point with GUARDRAILS_SERVER_URL unset
  # and asserts a non-zero exit code and the message naming the setting
  # (NFR7.2).
  app-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace ${{ env.APP_NAME }} build
      - run: yarn workspace ${{ env.BACKEND_NAME }} build
      - uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: |
            ${{ env.APP }}/dist
            ${{ env.BACKEND }}/dist
      - run: yarn workspace ${{ env.BACKEND_NAME }} check:exit

  # ---- u5-compose-and-ci: jobs for the compose run (packages/e2e) ----

  # The unit tests of the start script logic and the file checks (compose
  # file, image build file, ignore files, this workflow), with coverage. No
  # Docker. The 85% line threshold is in the package settings and is never
  # lowered. Also checks the package's dependencies against its allow-list.
  e2e-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace ${{ env.E2E_NAME }} check:packages
      - run: yarn workspace ${{ env.E2E_NAME }} test --watchAll=false --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-coverage
          path: ${{ env.E2E }}/coverage
          if-no-files-found: ignore

  # Builds the app image (not pushed) and checks it: a non-root user, exactly
  # one exposed port, at most 550 MB of file system
  # (person-approved limit, raised from 500 MB), and the entry the start command runs
  # exists inside the image (NFR1.4, NFR5.3).
  app-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the app image (not pushed)
        run: docker build -f ${{ env.BACKEND }}/Dockerfile -t guardrails-app:ci .
      - name: Check non-root user, one exposed port, size and entry
        run: |
          user=$(docker image inspect guardrails-app:ci --format '{{.Config.User}}')
          echo "image user: ${user}"
          test -n "${user}" && test "${user}" != "root" && test "${user}" != "0"
          ports=$(docker image inspect guardrails-app:ci --format '{{len .Config.ExposedPorts}}')
          echo "exposed ports: ${ports}"
          test "${ports}" = "1"
          # File system size in MB (du -m), the same on every Docker image store.
          size=$(docker run --rm --user 0 --entrypoint sh guardrails-app:ci -c 'du -sxm / 2>/dev/null | cut -f1')
          echo "image size: ${size} MB (limit 550 MB)"
          test "${size}" -le 550
          docker run --rm --entrypoint sh guardrails-app:ci -c 'test -f packages/backend/package.json && test -f packages/backend/dist/index.cjs.js'

  # Builds the three images, starts the sample, runs the real-browser, header,
  # token, audit, repeatability and timing checks, the missing-address start
  # and the output scan, then stops the sample. Needs Docker and the browsers
  # only; no secret. Any failing check, a 95th percentile over 5000 ms, or a
  # secret found in an output fails. Each step prints its time.
  compose-e2e:
    needs: app-image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      # The runner supplies Chrome and the browser system libraries. Install
      # only Playwright's patched Firefox, before starting the sample. Retrying
      # --with-deps is unsafe: a timed-out sudo apt-get can keep the dpkg lock.
      - name: Install Playwright Firefox
        timeout-minutes: 14
        run: |
          for attempt in 1 2 3; do
            time timeout --kill-after=30s 240s yarn workspace ${{ env.E2E_NAME }} playwright install firefox && exit 0
            echo "Firefox install attempt ${attempt} failed or timed out"
          done
          exit 1
      - name: Start the sample from a reset
        run: |
          time yarn compose:reset
          time yarn compose:up
      - name: Flows, accessibility, keyboard, tree, headers, token, audit and repeatability
        run: time yarn e2e specs
      - name: Timing (20 loads of each view, Chrome)
        run: time yarn e2e:timing
      - name: Published ports, missing-address start and output scan
        run: time yarn e2e checks
      - name: Status and logs of every service on failure
        if: failure()
        run: |
          docker compose --project-name guardrails-sample --env-file .env.compose ps --all
          docker compose --project-name guardrails-sample --env-file .env.compose logs --no-color
      - name: Stop the sample
        if: always()
        run: yarn compose:down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            ${{ env.E2E }}/dist/out
          retention-days: 7
          if-no-files-found: ignore

  # ---- u6-minikube-run: the same check on a local minikube cluster ----

  # Starts minikube in the job (Docker driver, 2 CPUs, 4096 MB; it is gone when
  # the job ends), builds the two images into it, applies k8s/, and runs the
  # u5 end-to-end specs unchanged against the port-forward on 127.0.0.1:7007
  # (FR9.1: the same check as the compose run). Then: exposure, image,
  # restart and output checks; a second fresh start whose upgrade plan must
  # equal the first byte for byte; the timing run, which is reported here and
  # does not block (E2E_TIMING_BLOCKING=false; it blocks in compose-e2e).
  # Nothing is pushed or published and no secret is used: minikube and kubectl
  # are downloaded at exact versions and checked against the SHA-256 values the
  # projects publish with each release, written here when the version was
  # chosen (never fetched at run time). Each step prints its time (NFR1.7).
  minikube-e2e:
    needs: app-image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      # The runner supplies Chrome and the browser system libraries. Install
      # only Playwright's patched Firefox, before starting minikube. Retrying
      # --with-deps is unsafe: a timed-out sudo apt-get can keep the dpkg lock.
      - name: Install Playwright Firefox
        timeout-minutes: 14
        run: |
          for attempt in 1 2 3; do
            time timeout --kill-after=30s 240s yarn workspace ${{ env.E2E_NAME }} playwright install firefox && exit 0
            echo "Firefox install attempt ${attempt} failed or timed out"
          done
          exit 1
      # minikube v1.39.0; digest from
      # https://github.com/kubernetes/minikube/releases/download/v1.39.0/minikube-linux-amd64.sha256
      - name: Install minikube v1.39.0 (checked against its published SHA-256)
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/minikube" https://github.com/kubernetes/minikube/releases/download/v1.39.0/minikube-linux-amd64
          echo "b738496da01be06bbaf80c688f57ce25acd3849fbb518155f3a88e03ef555aa4  ${RUNNER_TEMP}/minikube" | sha256sum -c -
          sudo install "${RUNNER_TEMP}/minikube" /usr/local/bin/minikube
          minikube version
      # kubectl v1.37.2; digest from https://dl.k8s.io/release/v1.37.2/bin/linux/amd64/kubectl.sha256
      - name: Install kubectl v1.37.2 (checked against its published SHA-256)
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/kubectl" https://dl.k8s.io/release/v1.37.2/bin/linux/amd64/kubectl
          echo "c04487523e7aa7d1493f7808174c899db93d7a9cf57531420cd76b9bd415f8f4  ${RUNNER_TEMP}/kubectl" | sha256sum -c -
          sudo install "${RUNNER_TEMP}/kubectl" /usr/local/bin/kubectl
          kubectl version --client
      - name: Start the minikube cluster
        # The runner has 4 CPUs and 16 GB. The cluster shares them with the
        # browsers, so it gets more headroom here than the 2 CPUs and 4 GB the
        # script asks for on a laptop: a slow answer from the guardrails server
        # makes the plugin report it unreachable for 5 seconds, and a view loaded
        # in that window shows an error.
        run: time minikube start --driver=docker --container-runtime=docker --cpus=4 --memory=8192
      - name: First fresh start of the sample
        run: |
          time yarn minikube:down
          time yarn minikube:up
      - name: Save the upgrade plan of one service
        run: yarn e2e plan-snapshot ${{ env.E2E }}/dist/out/plan-first.json
      - name: Flows, accessibility, keyboard, tree, headers, token, audit and repeatability
        run: time E2E_STACK=minikube yarn e2e specs
      - name: Exposure, images, restarts and output scan
        run: time yarn e2e minikube-checks
      - name: Second fresh start and the same plan, byte for byte
        run: |
          time yarn minikube:down
          time yarn minikube:up
          yarn e2e plan-snapshot ${{ env.E2E }}/dist/out/plan-second.json
          yarn e2e plan-compare ${{ env.E2E }}/dist/out/plan-first.json ${{ env.E2E }}/dist/out/plan-second.json
      - name: Timing (20 loads of each view, Chrome; reported, not blocking)
        run: time E2E_STACK=minikube E2E_TIMING_BLOCKING=false yarn e2e:timing
      - name: Exposure, images, restarts and output scan after the timing run
        run: time yarn e2e minikube-checks
      - name: Status, descriptions and logs of every pod on failure
        if: failure()
        run: |
          kubectl --context minikube -n guardrails-sample get pods,svc,pvc
          kubectl --context minikube -n guardrails-sample describe pods
          for pod in $(kubectl --context minikube -n guardrails-sample get pods -o name); do
            echo "--- log of ${pod}"
            kubectl --context minikube -n guardrails-sample logs "${pod}" --all-containers=true --tail=200
          done
      - name: Stop the sample
        if: always()
        run: yarn minikube:down
      - name: Port 7007 is closed after the stop
        if: always()
        run: yarn e2e minikube-closed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minikube-e2e-report
          path: |
            ${{ env.E2E }}/dist/out
          retention-days: 7
          if-no-files-found: ignore

  # The one status the repository requires (NFR2.5, FR10.1): it needs every
  # other job, runs even when one fails, and fails itself unless every needed
  # job succeeded.
  ci-ok:
    needs:
      - format
      - lint
      - typecheck
      - test
      - repeatability
      - contract
      - image
      - plugin-unit
      - plugin-rules
      - plugin-coverage
      - plugin-contract
      - plugin-build
      - ui-unit
      - ui-coverage
      - ui-contract
      - ui-build
      - ui-checks
      - app-unit
      - app-coverage
      - app-startup
      - app-catalog
      - app-checks
      - app-build
      - e2e-unit
      - app-image
      - compose-e2e
      - minikube-e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "${NEEDS}" | node -e "
            let text = '';
            process.stdin.on('data', d => (text += d));
            process.stdin.on('end', () => {
              const needs = JSON.parse(text);
              const bad = Object.entries(needs).filter(([, j]) => j.result !== 'success');
              for (const [name, j] of Object.entries(needs)) console.log(name + ': ' + j.result);
              if (bad.length > 0) {
                console.error('Not successful: ' + bad.map(([name]) => name).join(', '));
                process.exit(1);
              }
            });
          "
