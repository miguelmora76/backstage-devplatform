name: CI

# Shared workflow. u1-data-and-server adds the eight stages below for the
# guardrails server; u2-plugin-backend adds its own stages 4 to 8 (the jobs
# named plugin-*) and its lint and type check steps; u5-compose-and-ci extends
# it with the compose run. Nothing is deployed or pushed from here, and no
# secret is used: the default token only reads the code. The PostgreSQL
# password below is a throw-away value valid only inside the job.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PACKAGE: packages/guardrails-server
  PLUGIN: packages/plugin-guardrails-backend
  PLUGIN_NAME: plugin-guardrails-backend
  UI: packages/plugin-guardrails
  UI_NAME: plugin-guardrails

jobs:
  # Stage 1: Prettier check over all code (NFR6.1). Any difference fails.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn prettier:check

  # Stage 2: ESLint with Backstage's usual settings. Any error fails.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn --cwd ${{ env.PACKAGE }} backstage-cli package lint
      - run: yarn --cwd ${{ env.PLUGIN }} backstage-cli package lint
      # u3-plugin-ui: the same lint, plus its rules that forbid raw-HTML
      # insertion, fetch and storage outside the API and session, and ports.
      - run: yarn --cwd ${{ env.UI }} backstage-cli package lint

  # Stage 3: TypeScript compile without output. Any error fails.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn tsc -p ${{ env.PACKAGE }}
      - run: yarn tsc -p ${{ env.PLUGIN }}
      - run: yarn tsc -p ${{ env.UI }}

  # Stage 4: all unit tests (including the 200-call benchmark, the 10-call
  # concurrency test, the log-line test and the settings tests) with the
  # coverage report. A failing test, or line coverage below 85%, fails.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn --cwd ${{ env.PACKAGE }} backstage-cli package test --watchAll=false --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: ${{ env.PACKAGE }}/coverage
          if-no-files-found: ignore

  # Stage 5: builds the default data set twice and compares byte for byte,
  # then compares with the stored copy kept with the tests (NFR7.1).
  repeatability:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn --cwd ${{ env.PACKAGE }} build
      - name: Generate the default data set twice and compare
        run: |
          node ${{ env.PACKAGE }}/dist/generator/cli.js > first.json
          node ${{ env.PACKAGE }}/dist/generator/cli.js > second.json
          cmp first.json second.json
          cmp first.json ${{ env.PACKAGE }}/test-data/default-data-set.json

  # Stage 6: contract tests check the four tools against the C2 spec file.
  # u2-plugin-backend runs the same spec check on its stand-in.
  contract:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn --cwd ${{ env.PACKAGE }} backstage-cli package test --watchAll=false src/contract.test.ts

  # Stages 7 and 8: build the image without pushing it, check it runs as a
  # non-root user and exposes one port, then start it (read-only root file
  # system, no published port), wait for the health route, call one tool and
  # stop it. Not ready within 10 seconds, or a failed call, fails.
  image:
    needs: [repeatability, contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage 7 - build the image (not pushed)
        run: docker build -f ${{ env.PACKAGE }}/Dockerfile -t guardrails-server:ci .
      - name: Stage 7 - check non-root user and one exposed port
        run: |
          user=$(docker image inspect guardrails-server:ci --format '{{.Config.User}}')
          echo "image user: ${user}"
          test -n "${user}" && test "${user}" != "root" && test "${user}" != "0"
          ports=$(docker image inspect guardrails-server:ci --format '{{len .Config.ExposedPorts}}')
          echo "exposed ports: ${ports}"
          test "${ports}" = "1"
      - name: Stage 8 - container smoke test
        run: |
          docker run -d --name guardrails-smoke --read-only guardrails-server:ci
          ready=0
          for i in $(seq 1 10); do
            if docker exec guardrails-smoke node packages/guardrails-server/dist/probe/healthcheck.js; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "${ready}" != "1" ]; then
            docker logs guardrails-smoke
            exit 1
          fi
          docker exec guardrails-smoke node packages/guardrails-server/dist/probe/smoke.js
          docker logs guardrails-smoke
          docker stop guardrails-smoke
      - name: Stage 8 - container with the failure setting on fails the call
        run: |
          docker run -d --name guardrails-forced --read-only -e GUARDRAILS_FAILURE_MODE=on guardrails-server:ci
          for i in $(seq 1 10); do
            if docker exec guardrails-forced node packages/guardrails-server/dist/probe/healthcheck.js; then
              break
            fi
            sleep 1
          done
          if docker exec guardrails-forced node packages/guardrails-server/dist/probe/smoke.js; then
            echo "expected the call to fail with the failure setting on"
            exit 1
          fi
          docker stop guardrails-forced

  # ---- u2-plugin-backend: stages 4 to 8 for plugin-guardrails-backend ----

  # Stage 4 (plugin): unit tests that use the in-memory SQLite store. The
  # PostgreSQL cases skip because no connection string is set. Any failing test
  # fails.
  plugin-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace ${{ env.PLUGIN_NAME }} test --watchAll=false

  # Stage 5 (plugin): the rule tests (claim, release, repair, append-only
  # trigger, restart, concurrency) against the PostgreSQL service container.
  # No Docker-in-Docker is needed. Any failing test fails.
  plugin-rules:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BACKSTAGE_TEST_DATABASE_POSTGRES16_CONNECTION_STRING: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace ${{ env.PLUGIN_NAME }} test --watchAll=false src/integration src/store src/database src/workflow

  # Stage 6 (plugin): line coverage over the plugin code from the fast tests and
  # the PostgreSQL rule tests together. Below 85% fails (the threshold is in the
  # package settings and is never lowered).
  plugin-coverage:
    needs: [plugin-unit, plugin-rules]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BACKSTAGE_TEST_DATABASE_POSTGRES16_CONNECTION_STRING: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace ${{ env.PLUGIN_NAME }} test --watchAll=false --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-coverage
          path: ${{ env.PLUGIN }}/coverage
          if-no-files-found: ignore

  # Stage 7 (plugin): contract check. The stand-in server and the client are
  # compared with the C2 spec kept by u1; the route list and the code lists are
  # compared with the C1 file. Any mismatch fails.
  plugin-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace ${{ env.PLUGIN_NAME }} contract:check

  # Stage 8 (plugin): builds the plugin. The backend package that includes it
  # belongs to u4-backstage-app; its build is added to this job when it exists.
  plugin-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace ${{ env.PLUGIN_NAME }} build

  # ---- u3-plugin-ui: jobs for plugin-guardrails (the browser plugin) ----

  # All plugin tests in a simulated browser with the time zone and clock
  # pinned (NFR7.1), run once with the coverage report. The 85% line threshold
  # is in the package settings and is never lowered. Any failing test fails.
  ui-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace ${{ env.UI_NAME }} test --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-coverage
          path: ${{ env.UI }}/coverage
          if-no-files-found: ignore

  # Reads the coverage report that ui-unit produced (it does not run the tests
  # again) and fails below 85% line coverage.
  ui-coverage:
    needs: ui-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-coverage
          path: ui-coverage
      - name: Check line coverage is at least 85%
        run: |
          node -e "
            const s = require('./ui-coverage/coverage-summary.json');
            const pct = s.total.lines.pct;
            console.log('line coverage: ' + pct + '%');
            if (pct < 85) { console.error('below 85%'); process.exit(1); }
          "

  # Contract check: the stand-in backend is compared with c1-openapi.yaml of
  # u2, and the sign-in start answer is checked against u2's own module.
  ui-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace ${{ env.UI_NAME }} contract:check

  # Builds the plugin and keeps its output for ui-checks. The app package that
  # includes the plugin belongs to u4-backstage-app; its build is added to this
  # job when it exists.
  ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace ${{ env.UI_NAME }} build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ${{ env.UI }}/dist

  # On the built plugin: no host name or address in the code, at most 300 KB
  # compressed (NFR1.7, NFR5.11), and only allowed packages in the manifest
  # (NFR5.12).
  ui-checks:
    needs: ui-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ${{ env.UI }}/dist
      - run: node ${{ env.UI }}/scripts/check-packages.mjs
      - run: node ${{ env.UI }}/scripts/check-built.mjs
